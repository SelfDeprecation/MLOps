model:
  name: "Qwen/Qwen3-0.6B"
  dtype: "float32"          # CPU i5-8250U не имеет аппаратного ускорения BF16
  device: "auto"            # auto | cpu | cuda | mps
  enable_thinking: false    # единый chat template для обучения и инференса

generate:
  max_new_tokens: 200
  temperature: 0.0          # жадная детерминированная генерация
  seed: 42
  enable_thinking: false    # Qwen3 без этого отвечает <think>-блоком

bench:
  warmup_runs: 1            # прогрев не засчитывается в замер
  measure_runs: 3
  prompt: "Объясни, что такое MLOps, в трёх предложениях."

hooks:
  prompt: "Объясни, что такое MLOps, в трёх предложениях."
  plot: "docs/activations.png"

memory:
  # На машине с 24 ГиБ RAM один шаг Qwen3-0.6B в float32 помещается.
  # Каждый режим запускается в отдельном процессе, берётся худший пик.
  seq_len: 256
  batch_size: 1
  lr: 1.0e-5
  repeats: 1

lora:
  alpha_ratio: 2
  dropout: 0.0
  configs:
    - name: "r=8, q_proj+v_proj"
      r: 8
      target_modules: ["q_proj", "v_proj"]
    - name: "r=16, все линейные"
      r: 16
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                       "gate_proj", "up_proj", "down_proj"]

report:
  json: "docs/report.json"
  markdown: "docs/anatomy.md"

# ДЗ 3: авторский датасет диагностических вопросов по MLOps.
collect:
  version: "v2"              # v1 | v2
  examples_per_topic: 24
  sources:
    v1:
      groups: 50
    v2:
      groups: 70
  system_prompts:
    - "Ты — инженер MLOps. Дай практичный и проверяемый ответ на диагностический вопрос."
    - "Помоги разобрать эксплуатационный сбой ML-системы: назови проверку и безопасное действие."
    - "Отвечай как ревьюер ML-платформы: кратко объясни причину, сигнал и следующий шаг."
    - "Ты консультируешь команду по надёжности ML. Не выдумывай метрики и отделяй наблюдение от вывода."

clean:
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"

# ДЗ 4: токенизация выходов split из ДЗ 3.
data:
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000
  seed: 42

tokenize:
  max_seq_len: 384
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  enabled: true
  batch_size: 8

train_estimate:
  epochs: 3
  # Медиана генерации из ДЗ 1 на текущем CPU. Для обучения это оптимистичная граница.
  tokens_per_sec: 4.88
