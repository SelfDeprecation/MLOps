stages:
  collect:
    cmd: python -m src.collect
    deps:
      - src/collect.py
      - src/dataset_catalog.py
      - src/config.py
    params:
      - collect
      - paths.raw
      - paths.metrics_collect
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: false

  clean:
    cmd: python -m src.clean
    deps:
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/textnorm.py
      - src/stats.py
      - src/config.py
    params:
      - clean
      - paths.raw
      - paths.clean
      - paths.metrics_clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: false

  diversity:
    cmd: python -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - split.group_key
      - paths.clean
      - paths.metrics_diversity
    metrics:
      - metrics/diversity.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - data/clean.jsonl
      - metrics/diversity.json
      - src/split.py
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - contamination
      - clean.near_dup
      - paths.clean
      - paths.train
      - paths.val
      - paths.test
      - paths.metrics_split
    outs:
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: false

  tokenize:
    cmd: python -m src.tokenize_data
    deps:
      - data/train.jsonl
      - data/val.jsonl
      - src/tokenize_data.py
      - src/prompt.py
      - src/collate.py
      - src/pack.py
      - src/config.py
    params:
      - model.name
      - model.enable_thinking
      - tokenize
      - packing
      - train_estimate
      - data.train_jsonl
      - data.val_jsonl
      - data.out_dir
    outs:
      - data/tokenized
    metrics:
      - metrics/tokenize.json:
          cache: false

  train_all:
    cmd: python -m src.train --variant all_layers
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
    params:
      - model
      - data.train
      - data.val
      - lora
      - train
      - variants
    outs:
      - models/adapter_all_layers
    metrics:
      - metrics/train_all_layers.json:
          cache: false

  train_freeze:
    cmd: python -m src.train --variant freeze14
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
    params:
      - model
      - data.train
      - data.val
      - lora
      - train
      - variants
    outs:
      - models/adapter_freeze14
    metrics:
      - metrics/train_freeze14.json:
          cache: false

  compare:
    cmd: python -m src.compare --variant all_layers
    deps:
      - models/adapter_all_layers
      - src/compare.py
      - src/prompt.py
      - src/runtime.py
      - src/config.py
    params:
      - model
      - compare
    outs:
      - docs/compare.md:
          cache: false
      - metrics/compare_all_layers.json:
          cache: false
